name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: curl -sf --max-time 30 "https://adscreen-converter-bcztyg4gxrw69xyjlifjj4.streamlit.app/_stcore/health" || echo "Ping failed (app may be waking up)"
